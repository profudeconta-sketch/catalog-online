name: ISJ Cluj statistics export

on:
  pull_request:
    paths:
      - "app_web_catalog.py"
      - "isj_cluj_statistica_excel.py"
      - "tests/test_isj_cluj_statistica_excel.py"
      - ".github/workflows/isj-cluj-statistics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install openpyxl==3.1.5
      - name: Check syntax
        run: python -m py_compile isj_cluj_statistica_excel.py app_web_catalog.py tests/test_isj_cluj_statistica_excel.py
      - name: Run isolated export tests
        run: python -m unittest discover -s tests -p "test_isj_cluj_statistica_excel.py" -v
