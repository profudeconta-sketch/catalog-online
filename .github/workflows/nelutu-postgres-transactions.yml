name: Nelutu PostgreSQL transaction tests

on:
  pull_request:
    paths:
      - 'nelutu_postgres_budget.py'
      - 'test_nelutu_postgres_transactions.py'
      - '.github/workflows/nelutu-postgres-transactions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transaction-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile nelutu_postgres_budget.py test_nelutu_postgres_transactions.py
      - run: python -m unittest -v test_nelutu_postgres_transactions.py
