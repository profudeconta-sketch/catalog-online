name: Photo import safety tests
on:
  push:
    branches: [feature/photo-import-verifiable]
  pull_request:
    paths:
      - catalog_photo_import.py
      - app_web_catalog.py
      - test_catalog_photo_import.py
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl pillow
      - run: python -m unittest -v test_catalog_photo_import.py
      - run: python -m py_compile catalog_photo_import.py app_web_catalog.py
