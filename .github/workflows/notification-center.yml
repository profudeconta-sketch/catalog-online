name: Notification center tests
on:
  pull_request:
  push:
    branches: ["feature/notification-center"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m py_compile notification_storage.py document_storage.py leave_pass_storage.py
      - run: python -m unittest -v test_notification_storage.py
