name: Nelutu offline regression tests
on:
  pull_request:
    paths:
      - 'nelutu_*.py'
      - 'test_nelutu_*.py'
      - '.github/workflows/nelutu-tests.yml'
  workflow_dispatch:
jobs:
  nelutu:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated memory test dependency
        run: python -m pip install cryptography
      - name: Compile Neluțu modules
        run: python -m py_compile nelutu_assistant.py nelutu_parent_guide.py nelutu_education_dialogue.py nelutu_pedagogy_library.py nelutu_portal_faq.py nelutu_cloudflare_ai.py nelutu_ai_experiment.py nelutu_ai_privacy.py nelutu_ai_memory.py nelutu_ai_recall.py nelutu_ai_tutor.py nelutu_ai_persistent_memory.py nelutu_ai_budget.py nelutu_ai_answer_guard.py nelutu_ai_learning.py nelutu_ai_review_auth.py nelutu_ai_tone.py nelutu_ai_eval.py nelutu_ai_followup.py nelutu_ai_stress.py nelutu_ai_oral.py
      - name: Run offline unit tests
        run: python -m unittest discover -v -p 'test_nelutu_*.py'
