name: Nelutu LIVE oral exam (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nelutu-live-oral
  cancel-in-progress: false

jobs:
  oral-exam:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate public-only exam questions without credentials
        run: |
          python - <<'PY'
          from nelutu_ai_live_oral import QUESTIONS
          from nelutu_ai_privacy import approved_external_question
          assert len(QUESTIONS) == 3
          assert all(approved_external_question(q) for q, _ in QUESTIONS)
          print("Verified: three allowlisted public questions; no school data")
          PY
      - name: Run live model oral exam (three requests maximum)
        env:
          NELUTU_CF_ACCOUNT_ID: ${{ secrets.NELUTU_CF_ACCOUNT_ID }}
          NELUTU_CF_API_TOKEN: ${{ secrets.NELUTU_CF_API_TOKEN }}
        run: python nelutu_ai_live_oral.py
