name: Nelutu prototype offline validation (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact prototype revision
        uses: actions/checkout@v4
        with:
          ref: f845b45bef264dc99483db15660f49cc09fef361
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test-only dependency
        run: python -m pip install cryptography
      - name: Compile isolated prototype modules
        run: python -m py_compile nelutu_*.py test_nelutu_*.py
      - name: Run offline regression tests (no Cloudflare credentials)
        run: python -m unittest discover -v -p 'test_nelutu_*.py'
