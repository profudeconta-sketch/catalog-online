name: Nelutu experimental safety offline tests

on:
  pull_request:
    paths:
      - 'nelutu_neon_concurrency_probe.py'
      - 'nelutu_neon_isolated_health.py'
      - 'nelutu_streamlit_lab_budget.py'
      - 'nelutu_streamlit_lab_gate.py'
      - 'test_nelutu_streamlit_lab_gate.py'
      - 'test_nelutu_streamlit_lab_budget.py'
      - 'test_nelutu_neon_isolated_health.py'
      - 'test_nelutu_neon_probe_safety.py'
      - 'test_nelutu_sqlite_concurrency.py'
      - '.github/workflows/nelutu-experimental-safety-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile nelutu_neon_concurrency_probe.py test_nelutu_neon_probe_safety.py test_nelutu_sqlite_concurrency.py nelutu_neon_isolated_health.py test_nelutu_neon_isolated_health.py test_nelutu_streamlit_lab_budget.py nelutu_streamlit_lab_budget.py nelutu_streamlit_lab_gate.py test_nelutu_streamlit_lab_gate.py
      - run: python -m unittest -v test_nelutu_neon_probe_safety.py test_nelutu_sqlite_concurrency.py test_nelutu_neon_isolated_health.py test_nelutu_streamlit_lab_budget.py test_nelutu_streamlit_lab_gate.py
