name: Nelutu experimental safety offline tests

on:
  pull_request:
    paths:
      - 'nelutu_neon_concurrency_probe.py'
      - 'nelutu_neon_isolated_health.py'
      - 'nelutu_streamlit_lab_budget.py'
      - 'nelutu_streamlit_lab_gate.py'
      - 'nelutu_release_evidence.py'
      - 'nelutu_neon_lab_preview.py'
      - 'nelutu_free_dialogue_preparation.py'
      - 'nelutu_free_dialogue_transport.py'
      - 'test_nelutu_free_dialogue_transport.py'
      - 'test_nelutu_preview_free_chat_safety.py'
      - 'nelutu_dialogue_adapter.py'
      - 'nelutu_system_tutorial_context.py'
      - 'test_nelutu_system_tutorial_context.py'
      - 'test_nelutu_integration_boundary.py'
      - 'nelutu_unified_reply_policy.py'
      - 'test_nelutu_unified_reply_policy.py'
      - 'nelutu_unified_rehearsal.py'
      - 'test_nelutu_unified_rehearsal.py'
      - 'nelutu_unified_orchestrator.py'
      - 'test_nelutu_unified_orchestrator.py'
      - 'nelutu_gemini_preview.py'
      - 'test_nelutu_unified_preview.py'
      - 'test_nelutu_free_dialogue_preparation.py'
      - 'requirements-nelutu-neon-lab.txt'
      - 'test_nelutu_lab_dependencies.py'
      - 'test_nelutu_neon_lab_preview_safety.py'
      - 'test_nelutu_release_evidence.py'
      - 'test_nelutu_streamlit_lab_gate.py'
      - 'test_nelutu_streamlit_lab_budget.py'
      - 'test_nelutu_neon_isolated_health.py'
      - 'nelutu_neon_runtime_permissions.py'
      - 'test_nelutu_neon_runtime_permissions.py'
      - 'test_nelutu_neon_probe_safety.py'
      - 'test_nelutu_sqlite_concurrency.py'
      - '.github/workflows/nelutu-experimental-safety-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile nelutu_neon_concurrency_probe.py test_nelutu_neon_probe_safety.py test_nelutu_sqlite_concurrency.py nelutu_neon_isolated_health.py test_nelutu_neon_isolated_health.py nelutu_neon_runtime_permissions.py test_nelutu_neon_runtime_permissions.py test_nelutu_streamlit_lab_budget.py nelutu_streamlit_lab_budget.py nelutu_streamlit_lab_gate.py test_nelutu_streamlit_lab_gate.py nelutu_release_evidence.py test_nelutu_release_evidence.py nelutu_neon_lab_preview.py test_nelutu_neon_lab_preview_safety.py test_nelutu_lab_dependencies.py test_nelutu_free_dialogue_preparation.py test_nelutu_free_dialogue_transport.py test_nelutu_preview_free_chat_safety.py test_nelutu_system_tutorial_context.py test_nelutu_integration_boundary.py test_nelutu_unified_reply_policy.py test_nelutu_unified_orchestrator.py test_nelutu_unified_preview.py nelutu_unified_rehearsal.py test_nelutu_unified_rehearsal.py
      - run: python -m unittest -v test_nelutu_neon_probe_safety.py test_nelutu_sqlite_concurrency.py test_nelutu_neon_isolated_health.py test_nelutu_neon_runtime_permissions.py test_nelutu_streamlit_lab_budget.py test_nelutu_streamlit_lab_gate.py test_nelutu_release_evidence.py test_nelutu_neon_lab_preview_safety.py test_nelutu_lab_dependencies.py test_nelutu_free_dialogue_preparation.py test_nelutu_free_dialogue_transport.py test_nelutu_preview_free_chat_safety.py test_nelutu_system_tutorial_context.py test_nelutu_unified_rehearsal.py
