name: Conduct council PV report safety
on:
  pull_request:
    paths:
      - "app_web_catalog.py"
      - "conduct_council_report_pdf.py"
      - "tests/test_conduct_council_report_pdf.py"
      - ".github/workflows/conduct-council-pv.yml"
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install report test dependencies
        run: python -m pip install --disable-pip-version-check reportlab pypdf
      - name: Compile current teacher app and new PDF engine
        run: python -m py_compile app_web_catalog.py conduct_council_report_pdf.py
      - name: Run isolated synthetic-data PDF tests
        run: python -m unittest discover -s tests -p test_conduct_council_report_pdf.py -v
