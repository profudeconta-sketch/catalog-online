name: Nelutu isolated integration gate tests

on:
  pull_request:
    paths:
      - 'nelutu_integration_gate.py'
      - 'nelutu_integration_pipeline.py'
      - 'nelutu_optional_integration_adapter.py'
      - 'test_nelutu_optional_integration_adapter.py'
      - 'test_nelutu_integration_pipeline.py'
      - 'test_nelutu_integration_gate.py'
      - 'test_nelutu_single_ui_contract.py'
      - 'nelutu_single_answer_router.py'
      - 'test_nelutu_single_answer_router.py'
      - 'test_nelutu_context_non_disclosure.py'
      - 'test_nelutu_provider_fallback.py'
      - 'test_nelutu_local_failure.py'
      - 'test_nelutu_provider_response_validation.py'
      - 'test_nelutu_existing_ui_contract.py'
      - 'test_nelutu_activation_flags.py'
      - 'test_nelutu_integrated_readiness.py'
      - 'test_nelutu_gate_outages.py'
      - 'test_nelutu_stage65_rollback.py'
      - 'test_nelutu_stage66_integrated.py'
      - 'test_nelutu_stage67_no_outbound.py'
      - 'nelutu_deployment_readiness.py'
      - 'test_nelutu_deployment_readiness.py'
      - 'nelutu_gemini_preview.py'
      - 'nelutu_gemini_optional.py'
      - 'nelutu_gemini_demo.py'
      - '.github/workflows/nelutu-integration-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile authorization boundary
        run: python -m py_compile test_nelutu_stage67_no_outbound.py test_nelutu_stage66_integrated.py test_nelutu_stage65_rollback.py nelutu_deployment_readiness.py test_nelutu_deployment_readiness.py nelutu_integration_gate.py test_nelutu_integration_gate.py nelutu_integration_pipeline.py test_nelutu_integration_pipeline.py nelutu_optional_integration_adapter.py test_nelutu_optional_integration_adapter.py test_nelutu_single_ui_contract.py nelutu_single_answer_router.py test_nelutu_single_answer_router.py test_nelutu_context_non_disclosure.py test_nelutu_provider_fallback.py test_nelutu_local_failure.py test_nelutu_provider_response_validation.py test_nelutu_existing_ui_contract.py test_nelutu_activation_flags.py test_nelutu_integrated_readiness.py test_nelutu_gate_outages.py
      - name: Test authorization boundary
        run: python -m unittest -v test_nelutu_stage67_no_outbound.py test_nelutu_stage66_integrated.py test_nelutu_stage65_rollback.py test_nelutu_deployment_readiness.py test_nelutu_gate_outages.py test_nelutu_integrated_readiness.py test_nelutu_integration_gate.py test_nelutu_integration_pipeline.py test_nelutu_optional_integration_adapter.py test_nelutu_single_ui_contract.py test_nelutu_single_answer_router.py test_nelutu_context_non_disclosure.py test_nelutu_provider_fallback.py test_nelutu_local_failure.py test_nelutu_provider_response_validation.py test_nelutu_existing_ui_contract.py test_nelutu_activation_flags.py
